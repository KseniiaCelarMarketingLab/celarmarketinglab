<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@media (max-width:1100px){.hd-desk{display:none!important}.hd-burger{display:flex!important}}</style></helmet>
<header style="position:sticky;top:0;z-index:30;background:rgba(11,16,36,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07);font-family:'Chakra Petch',Helvetica,Arial,sans-serif">
<div style="max-width:1320px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:16px 36px">
<a href="Home v4.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#f4f1ea">
<img src="celar-mark.png" alt="" style="width:34px;height:auto;display:block;filter:saturate(1.8) brightness(1.2)">
<span style="font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:700;font-size:18px;letter-spacing:.14em">CELAR</span>
</a>
<nav class="hd-desk" style="display:flex;flex-wrap:wrap;gap:4px 28px;margin-left:auto;align-items:center">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="5"><a href="{{ item.href }}" style="font-size:15px;font-weight:500;text-decoration:none;color:{{ item.color }};padding:6px 0;border-bottom:2px solid {{ item.line }}" style-hover="color:#fff">{{ item.label }}</a></sc-for>
</nav>
<a class="hd-desk" href="#contact" style="font-size:15px;font-weight:600;text-decoration:none;color:#03141c;background:#5ee7ff;padding:11px 20px;border-radius:999px;box-shadow:0 0 24px rgba(94,231,255,.45)" style-hover="background:#a6f3ff">Send a request</a>
<button class="hd-burger" onClick="{{ toggle }}" aria-label="Menu" aria-expanded="{{ open }}" style="display:none;margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#f4f1ea;cursor:pointer;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;font-size:20px">{{ icon }}</button>
</div>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div class="hd-burger" style="display:none;flex-direction:column;gap:4px;padding:8px 32px 24px;border-top:1px solid rgba(255,255,255,.07)">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="5"><a href="{{ item.href }}" style="font-size:18px;font-weight:500;text-decoration:none;color:{{ item.color }};padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)">{{ item.label }}</a></sc-for>
<a href="#contact" onClick="{{ close }}" style="margin-top:14px;font-size:16px;font-weight:600;text-align:center;text-decoration:none;color:#03141c;background:#5ee7ff;padding:15px 20px;border-radius:999px">Send a request</a>
</div>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1320px&quot;,&quot;height&quot;:&quot;70px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;cases&quot;,&quot;eu&quot;,&quot;academy&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  onKey = (e) => { if (e.key === "Escape" && this.state.open) this.setState({ open: false }); };
  componentDidMount() { window.addEventListener("keydown", this.onKey); }
  componentWillUnmount() { window.removeEventListener("keydown", this.onKey); }
  renderVals() {
    const a = this.props.active;
    const items = [["services","Services","Services v4.dc.html"],["cases","Cases","Cases v4.dc.html"],["eu","EU Market Entry","EU Market Entry v4.dc.html"],["academy","Academy","Academy v4.dc.html"],["blog","Blog","Blog v4.dc.html"],["about","About","About v4.dc.html"]];
    return {
      nav: items.map(([k,l,h]) => ({ label:l, href:h, color: a===k ? "#5ee7ff" : "#c9ccd6", line: a===k ? "#5ee7ff" : "transparent" })),
      open: this.state.open, icon: this.state.open ? "✕" : "☰",
      toggle: () => this.setState(s => ({ open: !s.open })), close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
